name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.1.0)"
        required: true
        type: string

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate version format
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be in semver format (e.g. 1.2.3)"
            exit 1
          fi

      # The manifest version is bumped in the PR that ships the change, not here.
      # This job tags what is already on main; it never rewrites manifests and
      # never pushes a commit — main is protected, so a commit push is rejected
      # and the release half-completes with a tag pointing at an orphan.
      - name: Verify manifest version matches the requested release
        run: |
          V="${{ github.event.inputs.version }}"
          ACTUAL=$(python3 -c "import json,sys; print(json.load(open('.claude-plugin/marketplace.json'))['version'])")
          if [ "$ACTUAL" != "$V" ]; then
            echo "::error::.claude-plugin/marketplace.json is at $ACTUAL but the release asks for $V. Bump the manifest in a PR and merge it first — this job only tags what is already on main."
            exit 1
          fi
          echo "Manifest version $ACTUAL matches the requested release."

      - name: Verify generated manifests are in sync
        run: |
          python3 scripts/generate-marketplaces.py
          python3 scripts/validate-marketplaces.py
          git diff --exit-code -- .agents/plugins/marketplace.json .cursor-plugin/marketplace.json \
            || (echo "::error::Generated manifests are out of sync on main. Run 'make generate' and merge the result before releasing." >&2; exit 1)

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            --title "v${{ github.event.inputs.version }}" \
            --notes "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md) for details." \
            --latest
